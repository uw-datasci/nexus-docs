name: Auto-Update Docs on Dispatch

on:
  repository_dispatch:
    types: [update-docs]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Display name of the application, used as the changelog heading (e.g. 🎯 Main Website)"
        required: true
        type: string
      section_map:
        description: "Optional '<path-prefix> => <heading>' lines for repos hosting multiple apps"
        required: false
        type: string
        default: ""
      repo:
        description: "Source repository (owner/name)"
        required: true
        type: string
      pr_number:
        description: "Merged PR number in the source repository"
        required: true
        type: string
      pr_title:
        description: "Merged PR title"
        required: true
        type: string
      merge_sha:
        description: "Merge commit SHA of the merged PR"
        required: true
        type: string
      docs_mode:
        description: "'changelog' writes one semester page; 'general' scans pages/ instead"
        required: false
        type: choice
        options: [changelog, general]
        default: changelog
      semester_tag:
        description: "Manual override for the term code (e.g. F26). Leave empty to read the active term from public.terms"
        required: false
        type: string
        default: ""

# Run one docs update at a time, in order, so each run can stack on the PR the
# previous run opened. `queue: max` keeps every pending run instead of cancelling
# all but the newest.
concurrency:
  group: update-docs
  queue: max

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      APP_NAME: ${{ github.event.client_payload.app_name || inputs.app_name }}
      SECTION_MAP: ${{ github.event.client_payload.section_map || inputs.section_map }}
      SOURCE_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
      PR_TITLE: ${{ github.event.client_payload.pr_title || inputs.pr_title }}
      MERGE_SHA: ${{ github.event.client_payload.merge_sha || inputs.merge_sha }}
      DOCS_MODE: ${{ github.event.client_payload.docs_mode || inputs.docs_mode || 'changelog' }}

    steps:
      # Build on the newest open auto-docs PR instead of main, so docs PRs from
      # different apps stack on each other instead of conflicting.
      - name: Resolve Stack Base
        id: stack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="${SOURCE_REPO##*/}"
          branch="auto-docs/${name}-${PR_NUMBER}"

          latest=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --author app/github-actions --limit 100 \
            --json number,headRefName,createdAt \
            --jq "[.[] | select((.headRefName | startswith(\"auto-docs/\")) and .headRefName != \"$branch\")]
                  | sort_by(.createdAt) | last // empty | \"\(.number) \(.headRefName)\"")

          if [ -n "$latest" ]; then
            base_pr="${latest%% *}"
            base="${latest#* }"
            echo "Stacking on #$base_pr ($base)"
          else
            base_pr=""
            base="main"
            echo "No open auto-docs PRs; branching off main"
          fi

          {
            echo "name=$name"
            echo "branch=$branch"
            echo "base=$base"
            echo "base_pr=$base_pr"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Docs
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.stack.outputs.base }}

      - name: Checkout Source Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.MERGE_SHA }}
          path: source
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Copilot CLI Agent
        run: npm install -g @github/copilot

      - name: Pull Website DB Credentials
        if: env.DOCS_MODE != 'general'
        uses: infisical/secrets-action@v1.0.16
        with:
          env-slug: prod
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: uwdsc-54e-y
          secret-path: /website/db

      - name: Resolve Active Term
        id: term
        if: env.DOCS_MODE != 'general' && inputs.semester_tag == ''
        run: |
          chmod +x .github/scripts/resolve-term.sh
          .github/scripts/resolve-term.sh

      - name: Run Copilot to Update Docs
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          SOURCE_DIR: source
          SEMESTER_TAG: ${{ inputs.semester_tag || steps.term.outputs.code }}
        run: |
          chmod +x .github/scripts/update-docs.sh
          .github/scripts/update-docs.sh

      - name: Remove Source Checkout
        run: rm -rf source changes.diff

      - name: Create PR with Doc Updates
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update docs for ${{ env.SOURCE_REPO }}#${{ env.PR_NUMBER }}"
          title: "📚 Auto-Docs Update (${{ env.APP_NAME }} #${{ env.PR_NUMBER }})"
          branch: ${{ steps.stack.outputs.branch }}
          base: ${{ steps.stack.outputs.base }}
          delete-branch: true
          body: |
            ### 🤖 Automated Documentation Update

            Triggered by the merge of ${{ env.SOURCE_REPO }}#${{ env.PR_NUMBER }} (${{ env.PR_TITLE }}).

            **App:** ${{ env.APP_NAME }}
            **Changes:** Updated the docs to match the merged code changes.

      # Add the new PR to the GitHub stack its base PR is in (or start one), so the
      # chain can be reviewed in the stack view and merged with `gh stack merge`.
      # Non-fatal: the PR already targets the right base even if linking fails.
      - name: Link Into Stack
        if: steps.stack.outputs.base_pr != '' && steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_PR: ${{ steps.stack.outputs.base_pr }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh extension install github/gh-stack
          gh stack link "$BASE_PR" "$NEW_PR"

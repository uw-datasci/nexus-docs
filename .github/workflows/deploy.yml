name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0
  INFISICAL_PROJECT_SLUG: uwdsc-54e-y
  INFISICAL_SECRET_PATH: /docs

jobs:
  setup:
    name: Setup Variables
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ env.NODE_VERSION }}
      pnpm-version: ${{ env.PNPM_VERSION }}
      infisical-project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
      infisical-secret-path: ${{ env.INFISICAL_SECRET_PATH }}
    steps:
      - name: Output variables
        run: echo "Variables mapped to outputs."

  quality:
    name: Lint
    needs: setup
    uses: uw-datasci/nexus-workflows/.github/workflows/quality-gate.yml@v4
    with:
      node-version: ${{ needs.setup.outputs.node-version }}
      pnpm-version: ${{ needs.setup.outputs.pnpm-version }}
      lint-command: pnpm lint
      typecheck-command: pnpm typecheck
      
  deploy:
    name: Deploy to Vercel
    needs: [ setup, quality ]
    uses: uw-datasci/nexus-workflows/.github/workflows/deploy-vercel.yml@v4
    with:
      node-version: ${{ needs.setup.outputs.node-version }}
      pnpm-version: ${{ needs.setup.outputs.pnpm-version }}
      is-prod: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      infisical-project-slug: ${{ needs.setup.outputs.infisical-project-slug }}
      infisical-secret-path: ${{ needs.setup.outputs.infisical-secret-path }}
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
